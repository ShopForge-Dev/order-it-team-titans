name: 'Deploy to OKE'
description: 'Set image tags in a Kustomize overlay and apply it to the OKE cluster'

inputs:
  overlay:
    description: 'dev or prod'
    required: true
  image_tag:
    description: 'Immutable image tag to deploy (the sha- tag from build-and-push)'
    required: true
  oci_user:
    required: true
  oci_tenancy:
    required: true
  oci_fingerprint:
    required: true
  oci_key_content:
    required: true
  oci_region:
    required: true
  oke_cluster_id:
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install oci-cli
      shell: bash
      run: pip install --quiet oci-cli

    - name: Install kubectl & kustomize
      shell: bash
      run: |
        curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl && sudo mv kubectl /usr/local/bin/
        curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Configure OCI credentials
      shell: bash
      run: |
        mkdir -p ~/.oci
        printf '%s' "${{ inputs.oci_key_content }}" > ~/.oci/key.pem
        chmod 600 ~/.oci/key.pem
        cat > ~/.oci/config <<EOF
        [DEFAULT]
        user=${{ inputs.oci_user }}
        fingerprint=${{ inputs.oci_fingerprint }}
        tenancy=${{ inputs.oci_tenancy }}
        region=${{ inputs.oci_region }}
        key_file=~/.oci/key.pem
        EOF
        chmod 600 ~/.oci/config

    - name: Fetch kubeconfig for the OKE cluster
      shell: bash
      run: |
        mkdir -p ~/.kube
        oci ce cluster create-kubeconfig \
          --cluster-id "${{ inputs.oke_cluster_id }}" \
          --file "$HOME/.kube/config" \
          --region "${{ inputs.oci_region }}" \
          --token-version 2.0.0 \
          --kube-endpoint PUBLIC_ENDPOINT

    - name: Set image tags for this deploy
      shell: bash
      working-directory: app/k8s/overlays/${{ inputs.overlay }}
      run: |
        kustomize edit set image \
          ghcr.io/${{ github.repository_owner }}/orderit-backend=ghcr.io/${{ github.repository_owner }}/orderit-backend:${{ inputs.image_tag }} \
          ghcr.io/${{ github.repository_owner }}/orderit-frontend=ghcr.io/${{ github.repository_owner }}/orderit-frontend:${{ inputs.image_tag }}

    - name: Apply overlay
      shell: bash
      run: kubectl apply -k app/k8s/overlays/${{ inputs.overlay }}

    - name: Wait for rollout
      shell: bash
      run: |
        NS=orderit
        PREFIX=$([ "${{ inputs.overlay }}" = "dev" ] && echo "dev-" || echo "")
        kubectl rollout status deployment/${PREFIX}backend -n "$NS" --timeout=180s
        kubectl rollout status deployment/${PREFIX}frontend -n "$NS" --timeout=180s

    - name: Clean up credentials
      if: always()
      shell: bash
      run: rm -rf ~/.oci ~/.kube
