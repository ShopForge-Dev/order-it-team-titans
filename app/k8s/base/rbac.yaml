apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderit
  namespace: orderit
  labels:
    app: orderit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orderit
  namespace: orderit
  labels:
    app: orderit
rules:
  # Pods: read, list, watch
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Services: read, list
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  # ConfigMaps: read, list
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Secrets: read, list (for app config retrieval)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orderit
  namespace: orderit
  labels:
    app: orderit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orderit
subjects:
  - kind: ServiceAccount
    name: orderit
    namespace: orderit
