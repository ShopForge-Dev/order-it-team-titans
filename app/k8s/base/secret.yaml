apiVersion: v1
kind: Secret
metadata:
  name: orderit-secrets
  namespace: orderit
  labels:
    app: orderit
type: Opaque
stringData:
  # MongoDB
  DB_LOCAL_URI: "mongodb://mongo:27017/orderit"

  # JWT
  JWT_SECRET: "change-me-with-secure-random-string"
  JWT_EXPIRE: "7d"
  COOKIE_EXPIRE: "7"

  # Cloudinary
  CLOUDINARY_NAME: "your-cloudinary-name"
  CLOUDINARY_API_KEY: "your-cloudinary-api-key"
  CLOUDINARY_API_SECRET: "your-cloudinary-api-secret"

  # Stripe
  STRIPE_KEY: "pk_test_your-public-key"
  STRIPE_SECRET_KEY: "sk_test_your-secret-key"

  # Email (Mailtrap)
  SMTP_HOST: "sandbox.smtp.mailtrap.io"
  SMTP_PORT: "2525"
  SMTP_PASSWORD: "your-mailtrap-password"
  SMTP_FROM_EMAIL: "noreply@orderit.local"

  # Container Registry (if using private registry)
  REGISTRY_URL: "ghcr.io"
  REGISTRY_USERNAME: "your-github-username"
  REGISTRY_PASSWORD: "your-github-token"
