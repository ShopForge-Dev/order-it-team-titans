apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: orderit-staging

namespace: orderit

bases:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging

replicas:
  - name: backend
    count: 1
  - name: frontend
    count: 1

images:
  - name: ghcr.io/<GITHUB_ORG>/orderit-backend
    newTag: develop
  - name: ghcr.io/<GITHUB_ORG>/orderit-frontend
    newTag: develop

patches:
  # Reduce resource limits for staging
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"

  # Add staging-specific labels
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: backend
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/staging
        value: "true"

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/staging
        value: "true"

  # Disable HPA for staging (single replica)
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: frontend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

  # Staging ingress with DuckDNS + Let's Encrypt
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: orderit-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging-orderit.duckdns.org
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging-orderit.duckdns.org
      - op: replace
        path: /spec/tls/0/secretName
        value: staging-orderit-tls
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging