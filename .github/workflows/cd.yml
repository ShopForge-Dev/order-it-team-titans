name: CD

on:
  push:
    branches: [develop, main]
    paths:
      - 'app/backend/**'
      - 'app/frontend/**'
      - 'app/k8s/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, prod]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------
  # Build once, push both images, tag with the git sha (immutable) plus
  # a moving tag that matches what the Kustomize overlays expect:
  #   develop branch -> :develop   |   main branch -> :stable
  # ---------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
      moving_tag: ${{ steps.vars.outputs.moving_tag }}
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "moving_tag=stable" >> "$GITHUB_OUTPUT"
          else
            echo "moving_tag=develop" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/orderit-${{ matrix.component }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/orderit-${{ matrix.component }}:${{ steps.vars.outputs.moving_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: build-and-push
    if: github.ref_name == 'develop' || inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-oke
        with:
          overlay: dev
          image_tag: ${{ needs.build-and-push.outputs.sha_tag }}
          oci_user: ${{ secrets.OCI_CLI_USER }}
          oci_tenancy: ${{ secrets.OCI_CLI_TENANCY }}
          oci_fingerprint: ${{ secrets.OCI_CLI_FINGERPRINT }}
          oci_key_content: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          oci_region: ${{ secrets.OCI_CLI_REGION }}
          oke_cluster_id: ${{ secrets.OKE_CLUSTER_ID }}

  deploy-prod:
    needs: build-and-push
    if: github.ref_name == 'main' || inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: production   # add required reviewers on this environment in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-oke
        with:
          overlay: prod
          image_tag: ${{ needs.build-and-push.outputs.sha_tag }}
          oci_user: ${{ secrets.OCI_CLI_USER }}
          oci_tenancy: ${{ secrets.OCI_CLI_TENANCY }}
          oci_fingerprint: ${{ secrets.OCI_CLI_FINGERPRINT }}
          oci_key_content: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          oci_region: ${{ secrets.OCI_CLI_REGION }}
          oke_cluster_id: ${{ secrets.OKE_CLUSTER_ID }}
